name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build typst_abi wasm
        working-directory: rust
        run: cargo build -p typst-abi --target wasm32-unknown-unknown --release
      - name: Install wasm-opt
        run: npm install --no-save binaryen@132.0.0
      - name: Optimize wasm
        run: ./node_modules/.bin/wasm-opt rust/target/wasm32-unknown-unknown/release/typst_abi.wasm -Oz --strip-debug --strip-producers -o rust/target/wasm32-unknown-unknown/release/typst_abi.opt.wasm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site
        run: |
          mkdir -p _site/rust/target/wasm32-unknown-unknown/release
          cp -r app _site/app
          cp -r examples _site/examples
          cp rust/target/wasm32-unknown-unknown/release/typst_abi.opt.wasm _site/rust/target/wasm32-unknown-unknown/release/
          cp index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The project requires moonc >= 0.10.20. The stable channel is new
      # enough, so CI no longer needs the development channel.
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain version
        run: |
          moon version --all
          version=$(moon version --all | sed -n 's/.*moonc v\([0-9][0-9.]*\).*/\1/p' | head -1)
          echo "moonc=$version"
          test -n "$version"
          lowest=$(printf '%s\n0.10.20\n' "$version" | sort -V | head -1)
          if [ "$lowest" != "0.10.20" ]; then
            echo "moonc $version is older than the required 0.10.20"
            exit 1
          fi

      # The stable channel only moves on a release, so formatting and interface
      # drift are real regressions now and fail the build.
      - name: Format check
        run: moon fmt --check

      - name: Interface check
        run: |
          moon info
          git diff --exit-code -- ':(glob)**/pkg.generated.mbti'

      - name: Type check
        run: moon check --target wasm-gc

      - name: Unit tests
        run: moon test --target wasm-gc

      - name: Build wasm
        run: moon build --target wasm-gc

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Node DOM-shim integration tests
        run: node js/e2e.mjs

      - name: Real browser integration tests
        run: node js/browser_e2e.mjs

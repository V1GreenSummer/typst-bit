<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Typstbit</title>
    <link rel="stylesheet" href="./workbench.css" />
    <style>
      * { box-sizing: border-box; }
      html, body, #canvas-host { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #ffffff; }
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="canvas-host" aria-label="Typstbit workbench"></div>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const abiWasm = params.get("abi") ?? new URL(
        "../../../../rust/target/wasm32-unknown-unknown/release/typst_abi.opt.wasm",
        import.meta.url,
      );
      if (params.get("legacy") === "1") {
        const { bootTypstbit } = await import("./loader.js");
        const appWasm = params.get("app") ?? new URL(
          "../_build/wasm-gc/debug/build/web_wasm/web_wasm.wasm",
          import.meta.url,
        );
        await bootTypstbit({ appWasmUrl: appWasm, typstAbiUrl: abiWasm, canvasHost: "#canvas-host" });
      } else {
        const { bootWorkbench } = await import("./workbench.js");
        await bootWorkbench({ abiWasmUrl: abiWasm, host: document.querySelector("#canvas-host") });
      }
    </script>
  </body>
</html>

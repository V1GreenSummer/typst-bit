<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Typstbit</title>
    <link rel="preload" href="../../../rust/target/wasm32-unknown-unknown/release/typst_abi.opt.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
    <link rel="modulepreload" href="./workbench.js" />
    <link rel="stylesheet" href="./workbench.css" />
    <style>
      * { box-sizing: border-box; }
      html, body, #canvas-host { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #ffffff; }
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      #boot-overlay { position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center; background: #f5f6f8; color: #20242b; font: 14px/1.6 Inter, ui-sans-serif, system-ui, sans-serif; transition: opacity .3s ease; }
      #boot-overlay.done { opacity: 0; pointer-events: none; }
      .boot-card { width: 380px; max-width: 86vw; text-align: center; }
      .boot-title { font-size: 22px; font-weight: 700; letter-spacing: .02em; margin-bottom: 6px; }
      .boot-step { color: #515864; margin-bottom: 14px; min-height: 22px; }
      .boot-bar { height: 6px; border-radius: 999px; background: #dfe3e8; overflow: hidden; }
      .boot-fill { height: 100%; width: 0; border-radius: 999px; background: #315fce; transition: width .2s ease; }
      .boot-fill.indeterminate { width: 40%; animation: boot-slide 1.1s ease-in-out infinite; }
      .boot-hint { margin-top: 12px; color: #727985; font-size: 12px; }
      #boot-overlay.failed .boot-fill { background: #c44545; }
      @keyframes boot-slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    </style>
  </head>
  <body>
    <div id="canvas-host" aria-label="Typstbit workbench"></div>
    <div id="boot-overlay" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-title">Typst.bit</div>
        <div class="boot-step">正在加载编译器…</div>
        <div class="boot-bar"><div class="boot-fill indeterminate"></div></div>
        <div class="boot-hint">首次访问需下载约 4.5MB 编译器（之后走浏览器缓存，离线可用）</div>
      </div>
    </div>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const abiWasm = params.get("abi") ?? new URL(
        "../../../rust/target/wasm32-unknown-unknown/release/typst_abi.opt.wasm",
        import.meta.url,
      );
      if (params.get("legacy") === "1") {
        const { bootTypstbit } = await import("./loader.js");
        const appWasm = params.get("app") ?? new URL(
          "../_build/wasm-gc/debug/build/web_wasm/web_wasm.wasm",
          import.meta.url,
        );
        await bootTypstbit({ appWasmUrl: appWasm, typstAbiUrl: abiWasm, canvasHost: "#canvas-host" });
        document.getElementById("boot-overlay")?.remove();
      } else {
        const { bootWorkbench } = await import("./workbench.js");
        await bootWorkbench({ abiWasmUrl: abiWasm, host: document.querySelector("#canvas-host") });
      }
    </script>
  </body>
</html>
